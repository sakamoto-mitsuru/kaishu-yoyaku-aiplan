    <!-- memorial UI の写真画像 CDN（stg / prd の両ドメインを列挙、未使用側は no-op）。
         投稿写真の fetch をブラウザ初動と並列に始めるため preconnect する。
         <img src> / new Image() は non-CORS リクエストなので crossorigin は付けない。
         （付けると別接続プールに行き、実際の <img> リクエストで再接続が走る恐れがある。
           fonts.googleapis.com=CSS=non-CORS は無し、fonts.gstatic.com=font=CORS は付き、
           という下の対比と同じ理屈） -->
    <link rel="preconnect" href="https://img.itowa71.com" />
    <link rel="preconnect" href="https://img.stg.itowa71.com" />
    <!-- memorial UI で利用する和文フォント（Noto Serif JP / Noto Sans JP）
         Noto Serif JP の 600 は予約フォーム（pages/reservation/reservation.css）が
         モック準拠で使うウェイト。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@350;400;500;700&family=Noto+Serif+JP:wght@400;500;600;700&display=swap"

    <!-- biz 予約画面（回収管理 / 法事希望管理 / 配信管理）のアイコン。
         モック index.html と同じ Tabler Icons webfont を同じバージョンで読む。 -->

      rel="stylesheet"

    <title>業務管理機能 実画面モック</title>
    <script>
      (function () {
        var maxEvents = 20;
        var buffer = [];

        function sanitizeUrl(value) {
          if (!value) return "";
          try {
            var url = new URL(value, window.location.origin);
            return url.origin + url.pathname;
          } catch (e) {
            return String(value).split("?")[0].split("#")[0];
          }
        }

        function push(event) {
          if (buffer.length >= maxEvents) buffer.shift();
          buffer.push(event);
        }

        window.__BLOOM_EARLY_ERRORS__ = buffer;
        window.addEventListener(
          "error",
          function (event) {
            push({
              kind: "error",
              message: event.message || "window error before Sentry init",
              filename: sanitizeUrl(event.filename),
              lineno: event.lineno || null,
              colno: event.colno || null,
              errorName: event.error && event.error.name ? event.error.name : null,
              path: sanitizeUrl(window.location.href),
              timestamp: Date.now(),
            });
          },
          true
        );
        window.addEventListener(
          "unhandledrejection",
          function (event) {
            var reason = event.reason;
            push({
              kind: "unhandledrejection",
              message:
                reason && reason.message
                  ? reason.message
                  : typeof reason === "string"
                    ? reason
                    : "unhandled rejection before Sentry init",
              errorName: reason && reason.name ? reason.name : null,
              path: sanitizeUrl(window.location.href),
              timestamp: Date.now(),
            });
          },
          true
        );
      })();
    </script>
